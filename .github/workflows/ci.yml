# ============================================================
#  Integración Continua (CI) con GitHub Actions
#  Qué hace: cada vez que hacés "push", GitHub instala las
#  dependencias, revisa el estilo del código y corre las
#  pruebas automáticamente, en un servidor limpio.
#  Si algo se rompe, te avisa.
# ============================================================

name: CI                      # Nombre que verás en la pestaña "Actions" de GitHub

on:                           # ¿CUÁNDO se ejecuta este workflow?
  push:                       #   - cada vez que subís commits (push)
    branches: [ main, master ]
  pull_request:               #   - y cuando abrís un pull request
    branches: [ main, master ]

jobs:                         # Un workflow tiene uno o más "jobs" (trabajos)
  build:                      # Nuestro job se llama "build"
    runs-on: ubuntu-latest    # Se ejecuta en una máquina Linux limpia que GitHub presta

    steps:                    # Los pasos que ejecuta, en orden:

      # Paso 1: descargar tu código al servidor de GitHub
      - name: Descargar el código
        uses: actions/checkout@v4

      # Paso 2: instalar Python 3.14 (la misma versión que usamos localmente)
      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip          # Guarda dependencias para que la próxima vez sea más rápido

      # Paso 3: instalar el proyecto y sus dependencias de desarrollo
      #   El "-e ." instala el paquete en modo editable; "[dev]" agrega
      #   pytest, httpx y ruff (definidos en pyproject.toml).
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Paso 4: revisar el estilo del código (equivale a un "compila limpio")
      #   Python no compila, así que ruff cumple ese papel: detecta imports sin
      #   usar, nombres inexistentes y errores de sintaxis antes de ejecutar nada.
      - name: Revisar el código (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Paso 5: correr las pruebas
      #   Si algo falla, el workflow se marca en ROJO. Si todo pasa, en VERDE.
      - name: Correr las pruebas
        run: pytest -v

      # Paso 6: verificar que la aplicación de verdad levanta
      #   Los tests usan un cliente en memoria; esto arranca el servidor real
      #   con uvicorn y le pega al endpoint de salud, que es la prueba de que
      #   el proyecto "compila y levanta sin errores".
      - name: Verificar que la aplicación arranca
        run: |
          uvicorn app.main:app --app-dir src --port 8000 &
          for intento in $(seq 1 15); do
            if curl --silent --fail http://127.0.0.1:8000/api/salud; then
              echo ""
              echo "La aplicación respondió correctamente."
              exit 0
            fi
            sleep 1
          done
          echo "La aplicación no respondió a tiempo."
          exit 1
