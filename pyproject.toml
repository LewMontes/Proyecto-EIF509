[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gastonomo"
version = "0.1.0"
description = "Control de gastos personales por categorias - EIF509 Grupo G01"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    # driver de PostgreSQL para SQLAlchemy (dialecto postgresql+psycopg://).
    "psycopg[binary]>=3.1",
    # httpx habla con Microsoft Graph y con la API de Gmail al vincular un buzon.
    "httpx>=0.27",
    # cifra los tokens de acceso a los buzones antes de guardarlos en la base.
    "cryptography>=42",
    # carga las variables de .env sin que cada integrante tenga que exportarlas.
    "python-dotenv>=1.0",
    # exporta los movimientos a una hoja de Excel de verdad.
    "openpyxl>=3.1",
    # arma el reporte en PDF. Python puro -sin GTK/Cairo del sistema, que en
    # Windows suele complicar instalar alternativas como weasyprint.
    "reportlab>=4.0",
    # hashea las contraseñas de login. Costo fijo y sal incluida en el hash
    # -sin parámetros que ajustar a mano, a diferencia de un KDF genérico.
    "bcrypt>=4.1",
    # escribe la bitácora de trazabilidad de compras en MongoDB. Driver
    # síncrono -coherente con que el resto de la app tampoco es async.
    "pymongo>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # mide la cobertura de la capa de negocio. El CI falla si baja del 70%
    # -ver el paso "Correr las pruebas" en .github/workflows/ci.yml.
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # levanta un PostgreSQL real en Docker para las pruebas de integracion
    # (tests/integracion/). Las pruebas normales no lo necesitan: se saltan
    # solas si no hay Docker en la maquina.
    "testcontainers[postgres]>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integracion: corre contra un PostgreSQL real levantado con Testcontainers (necesita Docker)",
]

# Cobertura de la capa de negocio. Se mide solo `src/app/business` -no todo
# `src/app`- porque es donde viven las reglas del dominio: que un router o un
# modelo de SQLAlchemy esten cubiertos no dice nada sobre si una regla de
# negocio tiene prueba, y promediarlos esconderia justo lo que importa.
[tool.coverage.run]
source = ["src/app/business"]
branch = true

[tool.coverage.report]
show_missing = true
# El minimo que pide el laboratorio es 70%. Se deja ahi y no en el valor real
# para que agregar una rama sin prueba avise, sin que cada linea nueva rompa
# el CI por un punto decimal.
fail_under = 70
exclude_also = [
    # Los bloques de `typing.TYPE_CHECKING` no se ejecutan nunca en tiempo de
    # corrida: existen solo para que el verificador de tipos resuelva los
    # imports circulares de los `relationship()`.
    "if TYPE_CHECKING:",
    # Un Protocol solo declara la firma; su cuerpo es `...`.
    "class .*\\(Protocol\\):",
]
