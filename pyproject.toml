[project]
name = "gastonomo"
version = "0.1.0"
description = "Tracker de compras personales por categorias - EIF509 Laboratorio 1"
requires-python = ">=3.12"

# Solo lo que el Laboratorio 1 usa de verdad. El driver de PostgreSQL (psycopg)
# y la herramienta de migraciones entran mas adelante, junto con la base real.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------------------------------------------
#  pytest: los tests viven en tests/ y el codigo en src/
# ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ------------------------------------------------------------------
#  ruff: linter + formateador. Es lo que corre la CI en cada push.
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
